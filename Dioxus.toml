[application]
name = "codmin"
default_platform = "web"

[web.app]
title = "Arkret Admin"

# Production deployments set Content-Security-Policy at the web server
# or CDN tier before the WASM bootstrap runs.
[web.resource]
style = []

# dx 0.7.10 requires the dev subsection explicitly; without it
# `dx build --release` errors with "missing field `dev`".
[web.resource.dev]
style = []

[web.https]
enabled = false
