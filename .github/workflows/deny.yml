name: cargo-deny

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: codmin

jobs:
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin
      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: codmin/Cargo.toml
          command: check
