name: a11y

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/a11y/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/a11y.yml"
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    working-directory: codmin

jobs:
  axe:
    name: axe-core SPA scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin

      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - name: Check out Glory and Sapid
        working-directory: codmin
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: codmin/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build SPA
        run: python scripts/build-web.py --release --out-dir dist

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run axe-core scan
        env:
          COAUTH_PUBLIC_URL: http://127.0.0.1:4173
        run: |
          # Two-step scan harness:
          # 1. Serve the built SPA on http://127.0.0.1:4173 (any static
          #    server is fine; the local helper falls back to index.html
          #    for client-side routes).
          # 2. Scan the public OAuth login page through Playwright
          #    + @axe-core/playwright and fail on any "serious" or
          #    "critical" violation.
          node scripts/serve-spa.mjs dist 4173 &
          SPA_PID=$!
          trap "kill $SPA_PID" EXIT
          sleep 2
          node ./scripts/a11y/axe-scan.mjs http://127.0.0.1:4173
