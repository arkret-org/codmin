name: Release web bundle

on:
  push:
    branches:
      - main
    tags: ["v*"]
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: local-bundle-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: codmin

jobs:
  build:
    name: Build WASM artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin

      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: 5f99e7c40a12805267560aff908ec0873a46d17e
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: 9c08af591730cdf378dbf912669f4e4400ac92e3
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: 723070f3b1f2156062a759944f80d33730c82086
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout floria
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/floria
          path: floria
          ref: 8140a98952ecca14173c3a1eedf3e62454e1420a
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout garth
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/garth
          path: garth
          ref: 388f3c3d0cc38ac5cb6d3aed13c168be92c1440f
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout bridges
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/bridges
          path: bridges
          ref: e1d7f23643c1279bd79bacf42f4937d0a06cb574
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout arkret-spec
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/arkret-spec
          path: arkret-spec
          ref: 68a195f0f26ac892de46a588d2dcb10770bcb8e4
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Checkout savfox
        uses: actions/checkout@v6
        with:
          repository: savfox-ai/savfox
          path: savfox-ai/savfox
          ref: 30718f036341f22acb7cca1e35accee069a5d74a
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: codmin
          shared-key: wasm

      - name: Install dioxus-cli
        run: cargo install dioxus-cli@0.7.10 --locked

      - name: dx build --release
        run: dx build --release --locked

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Package the release artifact
        id: artifact
        run: |
          set -euo pipefail
          archive=$(python .ci/package-release.py --target web --dx web --app codmin)
          echo "archive=codmin/release-assets/$(basename "$archive")" >> "$GITHUB_OUTPUT"

      - name: Install CycloneDX generator
        run: cargo install cargo-cyclonedx@0.5.9 --locked

      - name: Set up Node for npm SBOM
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codmin/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Generate Rust and npm SBOMs
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --all --override-filename codmin-rust.cdx
          npm sbom --sbom-format cyclonedx > codmin-npm.cdx.json

      - name: Attest bundle build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}

      - name: Attest Rust SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: codmin/codmin-rust.cdx.json

      - name: Attest npm SBOM
        if: github.event_name != 'pull_request'
        uses: actions/attest@f6bf1532d7d6793fce74eac584813a8eee607999 # v4
        with:
          subject-path: ${{ steps.artifact.outputs.archive }}
          sbom-path: codmin/codmin-npm.cdx.json

      - name: Generate local cosign evidence
        run: bash scripts/local-cosign-evidence.sh "../${{ steps.artifact.outputs.archive }}" cosign-evidence

      - name: Upload local bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codmin-web-public
          path: |
            ${{ steps.artifact.outputs.archive }}
            ${{ steps.artifact.outputs.archive }}.sha256
            codmin/codmin-rust.cdx.json
            codmin/codmin-npm.cdx.json
            codmin/cosign-evidence/

      - name: Stage release SBOMs
        run: |
          cp codmin-rust.cdx.json codmin-npm.cdx.json release-assets/
          (cd release-assets && sha256sum codmin-*.cdx.json > SBOM.sha256)

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: codmin/release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify release checksums
        working-directory: release-assets
        run: sha256sum --check ./*.sha256
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: release-assets/*
