name: Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

defaults:
  run:
    working-directory: codmin

jobs:
  rust:
    name: cargo check + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin
          submodules: recursive

      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install nightly rustfmt
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: nightly
          components: rustfmt

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: codmin

      - name: cargo fmt (host)
        run: cargo +nightly fmt --package codmin -- --check

      - name: cargo check (host)
        run: cargo +stable check --workspace --all-targets --locked

      - name: cargo test (host)
        run: cargo +stable test --workspace --locked --no-fail-fast

      - name: cargo clippy (host)
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

  wasm-build:
    name: dx build (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin
          submodules: recursive

      - name: Check out arkret-rust-sdk
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ github.repository_owner }}/coland
          path: coland
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN || github.token }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN || github.token }}
        run: bash .ci/checkout-build-dependencies.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install binaryen
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Cache cargo registry, git, and target
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: codmin
          shared-key: wasm

      - name: Install dioxus-cli
        run: cargo install dioxus-cli@0.7.10 --locked

      - name: dx build --release
        run: dx build --release

      - name: Locate build artifact
        id: dist
        run: |
          set -euo pipefail
          dist_dir="$(find "$(cargo metadata --format-version 1 --no-deps | python -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')/dx" -type d -path '*/release/web/public' | head -n 1)"
          test -n "$dist_dir"
          test -f "$dist_dir/index.html"
          echo "build artifact at: $dist_dir"
          echo "dir=$dist_dir" >> "$GITHUB_OUTPUT"

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codmin-web-public
          path: ${{ steps.dist.outputs.dir }}

  e2e:
    name: Playwright (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: wasm-build
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codmin/package-lock.json
      - name: Install npm deps
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Download web artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codmin-web-public
          path: codmin/dist
      - name: Start static SPA
        env:
          COAUTH_PUBLIC_URL: http://127.0.0.1:4173
        run: |
          node scripts/serve-spa.mjs dist 4173 > serve.log 2>&1 &
          echo $! > serve.pid
          sleep 2
      - name: Run Playwright smoke
        env:
          CODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:smoke -- --reporter=line
      - name: Run axe Playwright gate
        env:
          CODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:a11y -- --reporter=line
      - name: Run keyboard gate
        env:
          CODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:keyboard -- --reporter=line
      - name: Run RTL gate
        env:
          CODMIN_E2E_BASE_URL: http://127.0.0.1:4173
        run: npm run test:rtl -- --reporter=line

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: wasm-build
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: codmin/package-lock.json
      - name: Install npm deps
        run: npm ci
      - name: Download web artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: codmin-web-public
          path: codmin/dist
      - name: Start static SPA
        env:
          COAUTH_PUBLIC_URL: http://127.0.0.1:4173
        run: |
          node scripts/serve-spa.mjs dist 4173 > serve.log 2>&1 &
          echo $! > serve.pid
          sleep 2
      - name: Run Lighthouse CI budget
        run: npm run lhci
