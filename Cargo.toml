[package]
name = "codmin"
version = "0.3.0"
authors = ["Arkret Authors"]
license = "AGPL-3.0-or-later"
edition = "2024"
rust-version = "1.98"

[workspace]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
mem_forget = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
arkret-canonical = { path = "../arkret-rust-sdk/crates/canonical", default-features = false }
arkret-identifiers = { path = "../arkret-rust-sdk/crates/identifiers", default-features = false }
arkret-models-collaboration = { path = "../arkret-rust-sdk/crates/models-collaboration", default-features = false }
arkret-models-crypto = { path = "../arkret-rust-sdk/crates/models-crypto", default-features = false }
arkret-models-discovery = { path = "../arkret-rust-sdk/crates/models-discovery", default-features = false }
arkret-models-identity = { path = "../arkret-rust-sdk/crates/models-identity", default-features = false }
arkret-wire = { path = "../arkret-rust-sdk/crates/wire", default-features = false }
chrono = "0.4.45"
coauth-account-types = { path = "../coauth/crates/account-types" }
coauth-admin-types = { path = "../coauth/crates/admin-types" }
glory = { path = "../../glory-rs/glory/crates/glory", default-features = false, features = ["web", "ssr"] }
sapid = { path = "../../glory-rs/sapid" }
futures-util = { version = "0.3.34", default-features = false }
gloo-net = "0.7"
gloo-storage = "0.4.0"
gloo-timers = "0.4"
js-sys = "=0.3.106"
log = "0.4.34"
regex-lite = "0.1.9"
reqwest = { version = "0.13", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
coland-contracts = { path = "../coland/crates/contracts" }
urlencoding = "2.1.3"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
web-sys = "=0.3.106"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "codmin-smoke"
path = "src/bin/codmin_smoke.rs"
required-features = ["smoke"]

[features]
default = []
smoke = ["dep:reqwest"]

[dependencies]
arkret-canonical = { workspace = true, default-features = false }
arkret-identifiers = { workspace = true, default-features = false }
arkret-models-collaboration = { workspace = true, default-features = false }
arkret-models-crypto = { workspace = true, default-features = false }
arkret-models-discovery = { workspace = true, default-features = false }
arkret-models-identity = { workspace = true, default-features = false }
arkret-wire = { workspace = true, default-features = false }
# Global report #10 — codmin previously hand-copied every protocol type.
# Depend on the precise protocol owner crates (default features off so the
# wasm bundle stays lean — the `client` / `keystore-*` / `salvo` / `mls`
# features pull native-only deps and are deliberately NOT enabled here).
chrono = { workspace = true, features = ["serde", "wasmbind"] }
coauth-account-types = { workspace = true }
coauth-admin-types = { workspace = true }
glory = { workspace = true }
sapid = { workspace = true }
futures-util = { workspace = true, default-features = false, features = ["alloc", "async-await-macro"] }
gloo-net = { workspace = true, features = ["http", "json"] }
gloo-storage = { workspace = true }
gloo-timers = { workspace = true, features = ["futures"] }
js-sys = { workspace = true }
log = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
coland-contracts = { workspace = true }
urlencoding = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
    "Window",
    "console",
    "Document",
    "HtmlDocument",
    "HtmlElement",
    "HtmlAnchorElement",
    "Location",
    "Storage",
    "MediaQueryList",
    "Url",
    "UrlSearchParams",
    "AbortController",
    "AbortSignal",
    "Headers",
    "RequestInit",
    "Request",
    "Response",
    "RequestCredentials",
    "RequestMode",
    "DomTokenList",
    "Element",
    "EventTarget",
    "Navigator",
    "Clipboard",
    "Blob",
    "BlobPropertyBag",
    "Crypto",
    "StorageEvent",
    "SubtleCrypto",
    "History",
    "PopStateEvent",
    "Event",
    "HtmlInputElement",
    "KeyboardEvent",
    "Url",
] }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, default-features = false, features = ["blocking", "json", "rustls"], optional = true }

[build-dependencies]

# Native-only deps used by the `codmin-smoke` post-deploy smoke test
# binary (src/bin/codmin_smoke.rs). Gated on cfg(not(target_arch="wasm32"))
# so they don't bloat the wasm bundle.
serde_json = { workspace = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true

[profile.release]
strip = "debuginfo"

[profile.dev]
debug = 0
