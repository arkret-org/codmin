name: Docker

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve image tags
    runs-on: ubuntu-24.04-arm64

    permissions:
      contents: read

    outputs:
      gitea_registry: ${{ steps.image.outputs.gitea_registry }}
      gitea_registry_user: ${{ steps.image.outputs.gitea_registry_user }}
      images: ${{ steps.image.outputs.images }}
      push_images: ${{ steps.image.outputs.push_images }}
      suffixes: ${{ steps.tags.outputs.suffixes }}
      use_dockerhub: ${{ steps.image.outputs.use_dockerhub }}
      use_gitea_registry: ${{ steps.image.outputs.use_gitea_registry }}

    steps:
      - name: Resolve image repositories
        id: image
        shell: bash
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USER: ${{ vars.DOCKERHUB_USER }}
          EVENT_NAME: ${{ gitea.event_name }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USER: ${{ vars.REGISTRY_USER }}
          REPOSITORY: ${{ gitea.repository }}
          SERVER_URL: ${{ gitea.server_url }}
        run: |
          set -euo pipefail

          repo_name="${REPOSITORY#*/}"
          registry_host="${SERVER_URL#http://}"
          registry_host="${registry_host#https://}"
          registry_host="${registry_host%%/*}"

          images=()
          use_gitea_registry="false"
          use_dockerhub="false"

          if [ -n "${REGISTRY_USER:-}" ] && [ -n "${REGISTRY_TOKEN:-}" ]; then
            use_gitea_registry="true"
            images+=("$registry_host/$REPOSITORY")
          fi

          if [ -n "${DOCKERHUB_USER:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
            dockerhub_namespace="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USER}"
            use_dockerhub="true"
            images+=("$dockerhub_namespace/$repo_name")
          fi

          if [ "${#images[@]}" -eq 0 ]; then
            images=("local/$repo_name")
            push_images="false"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            push_images="false"
          else
            push_images="true"
          fi

          {
            echo "gitea_registry=$registry_host"
            echo "gitea_registry_user=${REGISTRY_USER:-}"
            echo "push_images=$push_images"
            echo "use_dockerhub=$use_dockerhub"
            echo "use_gitea_registry=$use_gitea_registry"
            echo "images<<EOF"
            printf "%s\n" "${images[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compute tag suffixes
        id: tags
        shell: bash
        env:
          GITEA_SHA: ${{ gitea.sha }}
        run: |
          set -euo pipefail

          ref_name="${{ gitea.ref_name }}"
          ref_type="${{ gitea.ref_type }}"
          short_sha="${GITEA_SHA:0:12}"
          safe_ref="${ref_name//\//-}"

          suffixes=("sha-${short_sha}")

          if [ "$ref_type" = "branch" ]; then
            suffixes+=("$safe_ref")

            if [ "$safe_ref" = "main" ]; then
              suffixes+=("latest")
            fi
          fi

          if [ "$ref_type" = "tag" ] && [[ "$ref_name" == v* ]]; then
            version="${ref_name#v}"
            suffixes+=("$version")

            if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              suffixes+=("${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" "${BASH_REMATCH[1]}" "latest")
            fi
          fi

          {
            echo "suffixes<<EOF"
            printf "%s\n" "${suffixes[@]}" | awk '!seen[$0]++'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build-arm64:
    name: Build ARM64 image
    runs-on: ubuntu-24.04-arm64
    needs:
      - prepare

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out codmin
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: codmin

      - name: Check out coauth
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ gitea.repository_owner }}/coauth
          path: coauth
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Check out Arkret Rust SDK
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ gitea.repository_owner }}/arkret-rust-sdk
          path: arkret-rust-sdk
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Check out coland
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ gitea.repository_owner }}/coland
          path: coland
          ref: main
          token: ${{ secrets.CI_REPO_TOKEN }}

      - name: Complete Coland build dependency layout
        working-directory: coland
        env:
          CI_REPO_TOKEN: ${{ secrets.GITHUB_COM_TOKEN }}
        run: bash .ci/checkout-build-dependencies.sh

      - name: Check out Glory and Sapid
        working-directory: codmin
        run: bash .ci/checkout-ui-dependencies.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Gitea registry
        if: needs.prepare.outputs.use_gitea_registry == 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ needs.prepare.outputs.gitea_registry }}
          username: ${{ needs.prepare.outputs.gitea_registry_user }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Log in to Docker Hub
        if: needs.prepare.outputs.use_dockerhub == 'true'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          username: ${{ vars.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute ARM64 tags
        id: tags
        shell: bash
        env:
          IMAGES: ${{ needs.prepare.outputs.images }}
          SUFFIXES: ${{ needs.prepare.outputs.suffixes }}
        run: |
          set -euo pipefail

          tags=()
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            while IFS= read -r suffix; do
              [ -n "$suffix" ] || continue
              tags+=("${image}:${suffix}-arm64")
            done <<< "$SUFFIXES"
          done <<< "$IMAGES"

          {
            echo "tags<<EOF"
            printf "%s\n" "${tags[@]}" | awk '!seen[$0]++'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build ARM64 image
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=("-t" "$tag")
          done <<< "$TAGS"

          docker buildx build \
            --load \
            --platform linux/arm64 \
            --pull \
            --build-context savfox=../savfox-ai/savfox \
            --build-context glory=../glory-rs/glory \
            --build-context sapid=../glory-rs/sapid \
            "${tag_args[@]}" \
            -f codmin/Dockerfile \
            .

      - name: Smoke test ARM64 image
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail

          image="$(printf "%s\n" "$TAGS" | sed '/^$/d' | head -n1)"
          cid="$(docker run -d --name codmin-smoke --add-host coland:127.0.0.1 -e COLAND_URL=http://coland:8008 "$image")"

          cleanup() {
            docker rm -f "$cid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          sleep 2
          if [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != "true" ]; then
            docker logs "$cid"
            exit 1
          fi

          docker exec "$cid" nginx -t
          docker exec "$cid" wget --spider -q http://127.0.0.1:${CODMIN_PORT:-80}/healthz

      - name: Push ARM64 image tags
        if: needs.prepare.outputs.push_images == 'true'
        shell: bash
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"
