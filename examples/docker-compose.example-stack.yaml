# Real development services for the nightly health and admin SPA smoke gate.
# Coauth and Coland have separate databases. Account Authority authentication
# additionally requires the TLS and Station trust-edge deployment configuration.
name: arkret-codmin-example
services:
  postgres:
    image: postgres:16-alpine
    container_name: arkret-example-pg
    environment:
      POSTGRES_USER: arkret
      POSTGRES_PASSWORD: arkret
      POSTGRES_DB: arkret
    ports: ["127.0.0.1:55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arkret -d arkret"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [example_pgdata:/var/lib/postgresql/data]
    networks: [example-stack]

  coauth:
    image: ${COAUTH_IMAGE:-coauth:dev}
    build:
      context: ../..
      dockerfile: coauth/Dockerfile
    container_name: arkret-example-coauth
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--config", "/etc/coauth/config.yaml"]
    volumes:
      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro
      - example_coauth_data:/var/lib/coauth
      - example_coauth_master_key:/run/secrets:ro
    environment:
      COAUTH_DATABASE__URI: postgresql://arkret:arkret@postgres:5432/coauth
      COAUTH_CONFIG: /etc/coauth/config.yaml
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    ports: ["127.0.0.1:57080:7080"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [example-stack]

  # Initial key provisioning runs separately; ordinary servers only reload.
  coauth-provision:
    image: ${COAUTH_IMAGE:-coauth:dev}
    profiles: [setup]
    container_name: arkret-example-coauth-provision
    depends_on:
      postgres:
        condition: service_healthy
    command: ["server", "--config", "/etc/coauth/config.yaml", "--first-provisioning", "--no-worker"]
    volumes:
      - ./coauth-config.yaml:/etc/coauth/config.yaml:ro
      - example_coauth_data:/var/lib/coauth
      - example_coauth_master_key:/run/secrets:ro
    environment:
      RUST_LOG: info
      RUST_BACKTRACE: "1"
    healthcheck:
      test: ["CMD", "/usr/local/bin/coauth", "healthcheck", "--config", "/etc/coauth/config.yaml"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [example-stack]

  # One-shot setup outside server startup. Validate existing keys, never rotate.
  coland-keystore-init:
    image: ${COLAND_IMAGE:-coland:dev}
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        install -d -m 0700 -o 10001 -g 10001 /secrets /var/lib/coland/keystore /var/lib/coland/identity-bundle
        /usr/local/bin/coland-keystore-keygen --output /secrets/master-key --if-missing
        chown 10001:10001 /secrets/master-key
        chmod 0400 /secrets/master-key
        install -d -m 0700 -o 65532 -g 65532 /coauth-secrets /var/lib/coauth /var/lib/coauth/data /var/lib/coauth/data/media
        /usr/local/bin/coland-keystore-keygen --output /coauth-secrets/master-key --if-missing
        chown 65532:65532 /coauth-secrets/master-key
        chmod 0400 /coauth-secrets/master-key
    volumes:
      - example_coland_master_key:/secrets
      - example_coland_data:/var/lib/coland
      - example_coauth_master_key:/coauth-secrets
      - example_coauth_data:/var/lib/coauth
    network_mode: none

  coland:
    image: ${COLAND_IMAGE:-coland:dev}
    build:
      context: ../../coland
      dockerfile: Dockerfile
      additional_contexts:
        arkret-rust-sdk: ../../arkret-rust-sdk
        arkret-spec: ../../arkret-spec
        floria: ../../floria
    container_name: arkret-example-coland
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COLAND_BIND: 0.0.0.0:8787
      COLAND_HEALTHCHECK_URL: https://127.0.0.1:8787/health
      COLAND_PUBLIC_BASE_URL: https://coland.example:8787
      COLAND_TLS_CERT_PATH: /run/example-tls/coland.crt
      COLAND_TLS_KEY_PATH: /run/example-tls/coland.key
      SSL_CERT_FILE: /run/example-tls/ca.crt
      DATABASE_URL: postgresql://arkret:arkret@postgres:5432/coland
      COLAND_TRUST_DOMAIN: ak:trust_domain:coland.example
      COLAND_DEVELOPMENT_MODE: "true"
      COLAND_KEYSTORE_BACKEND: encrypted_file
      COLAND_KEYSTORE_PATH: /var/lib/coland/keystore/coland.v1
      COLAND_KEYSTORE_MASTER_KEY_FILE: /run/secrets/master-key
      COLAND_SERVICE_IDENTITY_BUNDLE_DIR: /var/lib/coland/identity-bundle
      RUST_LOG: info
    volumes:
      - example_coland_data:/var/lib/coland
      - example_coland_master_key:/run/secrets:ro
      - ./.local/tls/ca.crt:/run/example-tls/ca.crt:ro
      - ./.local/tls/coland.crt:/run/example-tls/coland.crt:ro
      - ./.local/tls/coland.key:/run/example-tls/coland.key:ro
    ports: ["127.0.0.1:58787:8787"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/coland", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      example-stack:
        aliases: [coland.example]

  floria:
    image: ${FLORIA_IMAGE:-floria:dev}
    build:
      context: ../../floria
      dockerfile: Dockerfile
      additional_contexts:
        arkret-rust-sdk: ../../arkret-rust-sdk
    container_name: arkret-example-floria
    # Explicit --config enables the documented FLORIA_* environment overrides.
    command: ["/usr/local/bin/floria", "--config", "/app/floria.kdl"]
    volumes: ["./floria-config.kdl:/app/floria.kdl:ro"]
    environment:
      RUST_LOG: info
      FLORIA_HTTP__BIND_ADDRESSES: '["0.0.0.0"]'
    ports: ["127.0.0.1:55000:5000"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/floria-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [example-stack]

  codmin:
    image: ${CODMIN_IMAGE:-codmin:dev}
    build:
      context: ../..
      dockerfile: codmin/Dockerfile
    container_name: arkret-example-codmin
    depends_on:
      coauth:
        condition: service_healthy
      coland:
        condition: service_healthy
    environment:
      COLAND_URL: https://coland.example:8787
      CODMIN_UPSTREAM_CA_FILE: /run/example-tls/ca.crt
      COAUTH_URL: http://coauth:7080
      COAUTH_PUBLIC_URL: http://localhost:57080
      CODMIN_PORT: "80"
    volumes: ["./.local/tls/ca.crt:/run/example-tls/ca.crt:ro"]
    ports: ["127.0.0.1:58200:80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [example-stack]

networks:
  example-stack:
    driver: bridge

volumes:
  example_pgdata:
  example_coland_data:
  example_coland_master_key:
  example_coauth_data:
  example_coauth_master_key:
