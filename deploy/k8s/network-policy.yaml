apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codmin-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codmin
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: codmin-allow-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: codmin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
