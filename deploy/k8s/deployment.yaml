apiVersion: apps/v1
kind: Deployment
metadata:
  name: codmin
  labels:
    app.kubernetes.io/name: codmin
    app.kubernetes.io/component: admin-spa
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: codmin
      app.kubernetes.io/component: admin-spa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codmin
        app.kubernetes.io/component: admin-spa
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: nginx
          # The codmin container is a single nginx serving the Glory / WASM
          # SPA plus reverse-proxy locations for coland + coauth. The current
          # Gitea workflow publishes architecture-suffixed ARM64 tags only;
          # replace the repository with your configured registry and pin a
          # digest for production rollouts.
          image: registry.example.com/arkret/codmin:replace-with-immutable-arm64-release
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: COLAND_URL
              value: http://coland.internal:8008
            - name: COAUTH_URL
              value: http://coauth.internal:7080
            - name: COAUTH_PUBLIC_URL
              value: https://coauth.example.com
            # Optional opt-in browser telemetry sink (see DEPLOYMENT.md).
            # - name: CODMIN_TELEMETRY_ENDPOINT
            #   value: https://telemetry.example.com/api/v1/telemetry/error
          readinessProbe:
            httpGet:
              path: /healthz/deep
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: runtime-config
              mountPath: /runtime
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir:
            sizeLimit: 1Mi
        - name: nginx-cache
          emptyDir:
            sizeLimit: 64Mi
        - name: nginx-run
          emptyDir:
            sizeLimit: 1Mi
        - name: runtime-config
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
