apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: codmin
  labels:
    app.kubernetes.io/name: codmin
    app.kubernetes.io/component: admin-spa
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # codmin enforces a strict CSP at the nginx layer; do not allow the
    # ingress controller to rewrite headers.
    nginx.ingress.kubernetes.io/server-snippet: |
      more_clear_headers "Server";
      more_set_headers "Strict-Transport-Security: max-age=63072000; includeSubDomains; preload";
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - codmin.example.com
      secretName: codmin-tls
  rules:
    - host: codmin.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: codmin
                port:
                  name: http
